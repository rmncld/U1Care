name: Validate
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  home-assistant:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        homeassistant: ["2026.8.2", "2026.10.1"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - run: python -m pip install -r requirements-test.txt "homeassistant==${{ matrix.homeassistant }}"
      - run: python scripts/check.py
      - uses: actions/checkout@v4
        with:
          repository: hacs/integration
          ref: 2.0.5
          path: work/hacs-reference
      - run: python -m pytest tests -q --basetemp="${{ runner.temp }}/u1-tests"
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          ignore: brands
          comment: "false"
  release:
    needs: [home-assistant, hacs]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: u1care-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Publish tested HACS version
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          version=$(python -c "import json; print(json.load(open('custom_components/u1_companion/manifest.json'))['version'])")
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "Release v$version already exists; leaving it unchanged."
            exit 0
          fi
          gh release create "v$version" --target "$RELEASE_SHA" --title "U1 Care $version" --notes-file "docs/RELEASE-$version.md" --latest
